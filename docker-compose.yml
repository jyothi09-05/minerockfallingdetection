version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: minemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minemind_db
      POSTGRES_USER: minemind_user
      POSTGRES_PASSWORD: minemind_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minemind_user -d minemind_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: minemind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    container_name: minemind-python-ai
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://minemind_user:minemind_password@postgres:5432/minemind_db
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: minemind-backend-java
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/minemind_db
      - SPRING_DATASOURCE_USERNAME=minemind_user
      - SPRING_DATASOURCE_PASSWORD=minemind_password
      - SPRING_REDIS_HOST=redis
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minemind-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - python-ai
      - backend-java

  prometheus:
    image: prom/prometheus:latest
    container_name: minemind-prometheus
    restart: unless-stopped
    volumes:
      - ./deployment/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: minemind-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=minemind
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
