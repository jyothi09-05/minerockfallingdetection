global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'minemind-python-ai'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['python-ai:8000', 'localhost:8000']

  - job_name: 'minemind-backend-java'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend-java:8080', 'localhost:8080']
