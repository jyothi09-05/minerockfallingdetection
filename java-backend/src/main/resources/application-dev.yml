spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/minemind_db}
    username: ${POSTGRES_USER:minemind_user}
    password: ${POSTGRES_PASSWORD:minemind_secure_password_2026!}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

logging:
  level:
    root: INFO
    com.minemind: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
